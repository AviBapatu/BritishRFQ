<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background with rounded corners -->
  <rect width="100" height="100" rx="18" fill="#0f172a"/>

  <!-- Bold B letterform -->
  <text
    x="50"
    y="68"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="72"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    dominant-baseline="auto"
  >B</text>

  <!-- Downward bid-line accent inside the lower bowl of B -->
  <polyline
    points="28,72 40,62 52,68 68,54"
    fill="none"
    stroke="#3b82f6"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Arrow tip -->
  <polyline
    points="62,54 68,54 68,60"
    fill="none"
    stroke="#3b82f6"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>